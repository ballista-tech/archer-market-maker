[package]
name = "archer-market-maker"
version = "0.2.0"
edition = "2024"
description = "A simple market maker for the Archer Exchange on Solana"
license = "Apache-2.0"

[dependencies]
archer-sdk = { version = "0.5.1", features = ["client"] }

# Solana
solana-sdk = "4"
solana-client = "4"
solana-account-decoder = "4"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"

borsh = "1.5"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"

# WebSocket price feeds
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Base64 decoding of on-chain `Program data:` event logs
base64 = "0.22"

# Atomics (AtomicF64)
portable-atomic = { version = "1", features = ["float"] }

# SPL token programs
spl-token = { version = "9", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8", features = ["no-entrypoint"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
